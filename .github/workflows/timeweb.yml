name: Timeweb build and deploy

on:
  push:
    branches: [main, codex/timeweb-autodeploy]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timeweb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare public browser settings
        env:
          PUBLIC_ENV: ${{ secrets.TIMEWEB_PUBLIC_ENV }}
        run: |
          umask 077
          printf '%s\n' "$PUBLIC_ENV" > "$RUNNER_TEMP/public.env"
          if grep -qEv '^[[:space:]]*(#.*)?$|^NEXT_PUBLIC_[A-Z0-9_]+=.*$' "$RUNNER_TEMP/public.env"; then
            echo 'Only single-line NEXT_PUBLIC_* settings are allowed.' >&2
            exit 1
          fi
      - name: Check deployment script
        run: |
          bash -n deploy/timeweb/deploy.sh
          python3 deploy/timeweb/test_deploy.py
      - name: Build application outside the production server
        run: |
          docker build --secret id=public_env,src="$RUNNER_TEMP/public.env" \
            --build-arg RELEASE_SHA="$GITHUB_SHA" \
            --tag "edinayasreda:$GITHUB_SHA" .
      - name: Deploy and check readiness
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.TIMEWEB_DEPLOY_ENABLED == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.TIMEWEB_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.TIMEWEB_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.TIMEWEB_HOST }}
        run: |
          set -euo pipefail
          : "${DEPLOY_KEY:?Missing TIMEWEB_DEPLOY_KEY}"
          : "${KNOWN_HOSTS:?Missing TIMEWEB_KNOWN_HOSTS}"
          : "${DEPLOY_HOST:?Missing TIMEWEB_HOST}"
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/timeweb_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/timeweb_deploy' EXIT
          docker save "edinayasreda:$GITHUB_SHA" | gzip -1 | \
            ssh -i ~/.ssh/timeweb_deploy -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
              "root@$DEPLOY_HOST" "deploy $GITHUB_SHA"
          echo "Deployed commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary settings
        if: always()
        run: rm -f "$RUNNER_TEMP/public.env"
